<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" /> 
    <meta name="google-site-verification" content="JBBlfe5CvQKoZZo7eZkH7J_iUpLR6q13f9kTqQYnEWY" />

    <title>PELITA – Game Edukasi Literasi Kesehatan Nusantara</title>

    <!-- SEO META (Tetap Sama) -->
    <meta name="description" content="PELITA adalah game edukasi interaktif berbasis web yang mengajak remaja memahami 12 indikator literasi kesehatan WHO melalui budaya wayang Nakula dan Sadewa." />
    <meta name="keywords" content="PELITA, game edukasi, literasi kesehatan, 12 indikator WHO, Nakula, Sadewa, kesehatan remaja" />
    <meta name="author" content="Fauzan" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://pelita.vercel.app/" />
    
    <!-- Favicon & OG Image (Tetap Sama) -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.png">
    <meta property="og:title" content="PELITA – Game Edukasi Literasi Kesehatan Nusantara" />
    <meta property="og:image" content="https://fzzn8273.github.io/pelita/og-image.png" />
    <meta property="og:url" content="https://pelita.vercel.app/" />
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />

    <style>
        :root {
            --hijau-medis: #2E8B57;
            --krem-hangat: #FFF8DC;
            --emas-wayang: #D4AF37;
            --putih-bersih: #FFFFFF;
            --coklat-ukiran: #5C4033;
            --merah-warni: #FF6B6B;
            --biru-warni: #4ECDC4;
            --ungu-warni: #9B59B6;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Nunito', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
            padding: 16px;
            background: var(--hijau-medis);
            background-image: radial-gradient(circle at 90% 10%, var(--krem-hangat) 0%, transparent 30%);
        }

        .container-website { width: 100%; max-width: 900px; padding: 20px; display: flex; flex-direction: column; }

        /* ===== PRINSIP 8: ESTETIKA & MINIMALIS ===== */
        .floating-header { position: fixed; top: 20px; right: 20px; z-index: 999; }
        .hamburger {
            background: var(--putih-bersih); border-radius: 50%; width: 48px; height: 48px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            color: var(--coklat-ukiran); font-size: 1.4rem;
            /* PRINSIP 7 & 8: Efisiensi & Estetika dengan Transisi Halus */
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.3s;
            border: 3px solid transparent;
        }
        .hamburger:hover { 
            transform: scale(1.1); 
            /* "Jalan" Border Menyala Warna-Warni */
            border-image: linear-gradient(45deg, var(--merah-warni), var(--emas-wayang), var(--biru-warni), var(--ungu-warni)) 1;
            border-style: solid;
            animation: flowBorder 3s linear infinite;
        }

        @keyframes flowBorder {
            0% { border-image-source: linear-gradient(45deg, var(--merah-warni), var(--emas-wayang), var(--biru-warni), var(--ungu-warni)); }
            100% { border-image-source: linear-gradient(225deg, var(--merah-warni), var(--emas-wayang), var(--biru-warni), var(--ungu-warni)); }
        }

        .nav-dropdown {
            position: absolute; top: 58px; right: 0;
            background: var(--putih-bersih); border-radius: 14px; padding: 10px 0; min-width: 160px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15); opacity: 0; visibility: hidden;
            transform: translateY(-8px); transition: all 0.3s ease;
            border: 2px solid var(--emas-wayang);
        }
        .nav-dropdown.open { opacity: 1; visibility: visible; transform: translateY(0); }

        /* PRINSIP 4: KONSISTENSI & STANDAR */
        .nav-dropdown button {
            display: block; width: 100%; background: transparent; border: none;
            padding: 12px 20px; font-family: inherit; font-weight: 700; font-size: 0.9rem;
            cursor: pointer; text-align: left; color: var(--coklat-ukiran);
            transition: background 0.2s, transform 0.2s;
        }
        .nav-dropdown button:hover { background: var(--krem-hangat); transform: translateX(5px); }

        /* PRINSIP 1: VISIBILITAS STATUS SISTEM (Highlight Halaman Aktif) */
        .nav-dropdown button.active {
            background: var(--hijau-medis);
            color: var(--putih-bersih);
            border-left: 4px solid var(--emas-wayang);
        }

        /* PRINSIP 6: RECOGNITION NOT RECALL (Ikon Jelas) */
        .nav-dropdown button i { margin-right: 12px; width: 20px; }

        /* PRINSIP 7: FLEKSIBILITAS & EFISIENSI (Link Game Langsung) */
        .btn-spring {
            display: inline-block; margin-top: 20px; background: var(--emas-wayang);
            color: var(--coklat-ukiran); padding: 12px 32px; border-radius: 40px;
            text-decoration: none; font-weight: 800; font-size: 1.1rem; 
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .btn-spring:hover { transform: scale(1.05); box-shadow: 0 6px 20px var(--emas-wayang); }

        /* Layout & Gambar */
        .home-wrapper { display: flex; flex-direction: column; gap: 3vh; }
        .img-section { width: 100%; border-radius: 24px; overflow: hidden; line-height: 0; background: var(--putih-bersih); box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .img-section img { width: 100%; height: auto; display: block; }
        .header-img { border: 2px solid var(--emas-wayang); }
        .body-img   { border: 2px solid var(--hijau-medis); }
        .footer-img { border: 2px solid var(--coklat-ukiran); background: var(--coklat-ukiran); }
        .profile-neon-border { border-radius: 24px; border: 2px solid var(--emas-wayang); box-shadow: 0 0 15px var(--emas-wayang); }
        .divider-section { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 2.5vh; margin: 4vh 0; }
        .dashed-line { width: 70%; border-top: 2px dashed var(--emas-wayang); opacity: 0.5; }
        .dashed-line.small { width: 50%; }
        .dashed-line.large { width: 85%; }
        .halaman { display: none; padding: 20px 0; text-align: center; }
        .halaman.active { display: block; }
        .hero-other h2 { color: var(--putih-bersih); margin-bottom: 1rem; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }

        .seo-intro { text-align: center; padding: 20px; background: rgba(255, 248, 220, 0.9); border-radius: 20px; margin: 20px 0; color: var(--coklat-ukiran); font-size: 18px; line-height: 1.8; }
        .seo-intro h1 { font-size: 28px; font-weight: 800; margin-bottom: 10px; }
        .seo-intro p { max-width: 800px; margin: 0 auto; }

        /* Responsive (PRINSIP 7: Efisiensi) */
        @media (max-width: 600px) {
            .container-website { padding: 10px; }
            .floating-header { top: 10px; right: 10px; }
            .hamburger { width: 44px; height: 44px; }
            .seo-intro h1 { font-size: 22px; }
        }
    </style>
</head>
<body>

    <header class="floating-header" role="navigation" aria-label="Menu Utama">
        <button class="hamburger" id="hamburgerBtn" aria-label="Buka menu" title="Menu Navigasi"><i class="fas fa-bars"></i></button>
        <nav class="nav-dropdown" id="navDropdown" aria-label="Navigasi">
            <!-- PRINSIP 3: USER CONTROL & FREEDOM (Tombol Bisa Dipencet & Berpindah Halaman) -->
            <button data-target="home" class="nav-item"><i class="fas fa-home"></i> Home</button>
            <button data-target="profile" class="nav-item"><i class="fas fa-user"></i> Profile</button>
            <button data-target="howtoplay" class="nav-item"><i class="fas fa-gamepad"></i> Cara main</button>
            <a href="https://pelita.vercel.app" target="_blank" style="text-decoration:none; display:block; padding: 12px 20px; font-weight:800; color: var(--emas-wayang); transition: 0.2s;">🚀 Mulai Game</a>
        </nav>
    </header>

    <main class="container-website">
        <div id="home" class="home-wrapper">
            <div class="seo-intro">
                <h1>PELITA – Penerang Literasi Kesehatan</h1>
                <p>PELITA mengemas <strong>12 indikator WHO</strong> ke dalam petualangan wayang Nakula dan Sadewa.</p>
            </div>
            <div class="img-section header-img"><img src="page1.png" alt="Header PELITA" /></div>
            <div class="divider-section">
                <div class="dashed-line large"></div><div class="dashed-line"></div>
            </div>
            <div class="img-section body-img"><img src="page2.png" alt="Body PELITA" /></div>
            <div class="divider-section">
                <div class="dashed-line"></div><div class="dashed-line large"></div>
            </div>
            <div class="img-section footer-img"><img src="page3.png" alt="Footer PELITA" /></div>
        </div>

        <div id="profile" class="halaman">
            <div style="width: 100%; display: flex; flex-direction: column; gap: 4vh;">
                <div class="img-section profile-neon-border"><img src="profile1.png" alt="Profil Fauzan" /></div>
                <div class="img-section profile-neon-border"><img src="profile2.png" alt="Profil Roadmap" /></div>
                <div class="img-section profile-neon-border"><img src="profile3.png" alt="Profil Pembimbing" /></div>
            </div>
        </div>
        
        <div id="howtoplay" class="halaman hero-other">
            <h2>Cara Main PELITA</h2>
            <a class="btn-spring" href="https://pelita.vercel.app" target="_blank">Mulai Sekarang →</a>
            <div style="margin-top: 30px; width: 100%;">
                <div class="img-section footer-img"><img src="page3.png" alt="Footer PELITA" /></div>
            </div>
        </div>
    </main>

    <!-- Chat AI (Dengan Error Prevention & Help) -->
    <button id="ai-chat-btn" style="position:fixed; bottom:20px; right:20px; z-index:999999; width:60px; height:60px; border-radius:50%; background:#2E8B57; border:4px solid white; font-size:28px; color:white; cursor:pointer; box-shadow:0 4px 20px rgba(0,0,0,0.5);" onclick="toggleChat()" aria-label="Buka asisten PELITA">🕯️</button>

    <div id="ai-chat-window" style="position:fixed; bottom:90px; right:20px; z-index:999998; width:340px; max-width:90vw; height:420px; background:#fff; border-radius:20px; box-shadow:0 10px 40px rgba(0,0,0,0.3); display:none; flex-direction:column; overflow:hidden;">
        <div id="ai-chat-header" style="background:#2E8B57; color:white; padding:14px 16px; font-weight:bold; display:flex; justify-content:space-between; align-items:center;">
            <span>🕯️ Asisten PELITA</span>
            <button onclick="toggleChat()" style="background:transparent; border:none; color:white; font-size:20px; cursor:pointer;" aria-label="Tutup chat">✕</button>
        </div>
        <div id="ai-chat-messages" style="flex:1; padding:12px; overflow-y:auto; background:#f9f9f9; display:flex; flex-direction:column; gap:8px;">
            <div class="msg-bot" style="align-self:flex-start; background:#eee; padding:10px 14px; border-radius:16px 16px 16px 0; max-width:85%; font-size:14px; color:#333;">
                Halo! Saya Asisten PELITA. Tanya soal obat, gizi, TBC, atau vaksin. (Ketik "help" untuk bantuan).
            </div>
        </div>
        <div id="ai-chat-input-area" style="padding:10px; border-top:1px solid #ddd; display:flex; gap:8px; background:#fff;">
            <input type="text" id="ai-chat-input" placeholder="Tulis pertanyaan..." style="flex:1; padding:10px; border:1px solid #ddd; border-radius:30px; outline:none;" onkeypress="if(event.key==='Enter') sendChatGemini()">
            <button id="ai-chat-send" onclick="sendChatGemini()" style="background:#2E8B57; color:white; border:none; padding:8px 18px; border-radius:30px; cursor:pointer; font-weight:bold;">Kirim</button>
        </div>
    </div>

    <script src="knowledge.js"></script>
    <script src="script.js"></script>
</body>
</html>
