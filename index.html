<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PELITA – Game Edukasi Literasi Kesehatan</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --hijau: #2E8B57;
            --krem: #FFF8DC;
            --emas: #D4AF37;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Nunito', sans-serif; background: var(--hijau); overflow-x: hidden; }

        /* ===== NAVIGASI (FIX Z-INDEX & POSISI) ===== */
        .floating-header {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999; /* PENTING: Supaya tidak ketutupan gambar */
        }
        .hamburger {
            width: 50px; height: 50px;
            background: #fff;
            border: 2px solid var(--emas);
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.5rem;
            color: var(--hijau);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        .nav-dropdown {
            position: absolute;
            top: 60px; right: 0;
            background: #fff;
            border-radius: 10px;
            padding: 10px;
            width: 180px;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .nav-dropdown.open { display: block; }
        .nav-dropdown button, .nav-dropdown a {
            display: block; width: 100%;
            padding: 10px;
            background: none; border: none;
            text-align: left;
            cursor: pointer;
            font-family: inherit;
            font-weight: 700;
            color: #333;
            text-decoration: none;
        }
        .nav-dropdown button:hover, .nav-dropdown a:hover { background: #f0f0f0; }

        /* ===== LAYOUT & GAMBAR ===== */
        .container-website { max-width: 900px; margin: 0 auto; padding: 20px; }
        .img-section { width: 100%; border-radius: 20px; overflow: hidden; background: #fff; margin-bottom: 20px; }
        .img-section img { width: 100%; height: auto; display: block; }
        .seo-intro { text-align: center; background: var(--krem); padding: 20px; border-radius: 20px; margin-bottom: 20px; color: #333; }
        .halaman { display: none; }
        .halaman.active { display: block; }

        /* ===== AI CHAT (FIX POINTER & Z-INDEX) ===== */
        #ai-chat-btn {
            position: fixed; bottom: 20px; right: 20px;
            z-index: 9999; /* Pastikan di atas semua */
            width: 60px; height: 60px;
            background: var(--emas);
            border: 4px solid #fff;
            border-radius: 50%;
            font-size: 28px;
            cursor: pointer;
            box-shadow: 0 5px 20px rgba(0,0,0,0.3);
        }
        #ai-chat-window {
            position: fixed; bottom: 90px; right: 20px;
            z-index: 9999;
            width: 350px; max-width: 90vw;
            height: 450px;
            background: #fff;
            border-radius: 15px;
            display: none;
            flex-direction: column;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        #ai-chat-header { background: var(--hijau); color: #fff; padding: 12px; display: flex; justify-content: space-between; align-items: center; }
        #ai-chat-header button { background: none; border: none; color: #fff; font-size: 20px; cursor: pointer; }
        #ai-chat-messages { flex: 1; padding: 10px; overflow-y: auto; background: #f9f9f9; }
        #ai-chat-input-area { padding: 10px; border-top: 1px solid #ddd; display: flex; gap: 5px; }
        #ai-chat-input { flex: 1; padding: 10px; border: 1px solid #ddd; border-radius: 20px; outline: none; }
        #ai-chat-send { background: var(--hijau); color: #fff; border: none; padding: 10px 15px; border-radius: 20px; cursor: pointer; }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 600px) {
            .container-website { padding: 10px; }
            .floating-header { top: 10px; right: 10px; }
            #ai-chat-btn { bottom: 15px; right: 15px; }
        }
    </style>
</head>
<body>

    <!-- NAVIGASI (DI LUAR CONTAINER BIAR GA KETUTUPAN) -->
    <header class="floating-header">
        <button class="hamburger" id="hamburgerBtn"><i class="fas fa-bars"></i></button>
        <nav class="nav-dropdown" id="navDropdown">
            <button data-target="home">🏠 Home</button>
            <button data-target="profile">👤 Profile</button>
            <button data-target="howtoplay">🎮 Cara Main</button>
            <a href="https://pelita.vercel.app" target="_blank">🚀 Mulai Game</a>
        </nav>
    </header>

    <!-- KONTEN -->
    <main class="container-website">
        <div id="home" class="halaman active">
            <div class="seo-intro">
                <h1>PELITA – Penerang Literasi Kesehatan</h1>
                <p>Game edukasi 12 indikator kesehatan WHO untuk remaja Indonesia.</p>
            </div>
            <div class="img-section"><img src="page1.png" alt="Header"></div>
            <div class="img-section"><img src="page2.png" alt="Body"></div>
            <div class="img-section"><img src="page3.png" alt="Footer"></div>
        </div>

        <div id="profile" class="halaman" style="padding-top: 60px;">
            <div class="img-section"><img src="profile1.png" alt="Profil"></div>
            <div class="img-section"><img src="profile2.png" alt="Profil"></div>
        </div>

        <div id="howtoplay" class="halaman" style="padding-top: 60px;">
            <h2>Cara Main</h2>
            <p>Baca cerita, pilih A/B/C, dapat bintang. Bintang tidak berkurang jika salah.</p>
        </div>
    </main>

    <!-- AI CHAT -->
    <button id="ai-chat-btn">🕯️</button>
    <div id="ai-chat-window">
        <div id="ai-chat-header">
            <span>🕯️ Asisten PELITA</span>
            <button onclick="toggleChat()">✕</button>
        </div>
        <div id="ai-chat-messages">
            <div style="padding:10px; background:#eee; border-radius:10px; margin-bottom:10px;">Halo! Tanya soal Bu Okta, Fauzan, atau @mfznndii_0605!</div>
        </div>
        <div id="ai-chat-input-area">
            <input type="text" id="ai-chat-input" placeholder="Tulis pertanyaan..." onkeypress="if(event.key==='Enter') sendChatGemini()">
            <button id="ai-chat-send" onclick="sendChatGemini()">Kirim</button>
        </div>
    </div>

    <!-- SCRIPT DI PALING BAWAH (INI YANG BIKIN TOMBOL GA BISA DIKLIK TADINYA) -->
    <script src="knowledge.json"></script> <!-- BUKAN JS, TAPI JSON! JANGAN DIPAKE -->
    <script>
        // ===== 1. LOGIKA NAVIGASI =====
        const hamburgerBtn = document.getElementById('hamburgerBtn');
        const navDropdown = document.getElementById('navDropdown');
        hamburgerBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            navDropdown.classList.toggle('open');
        });
        document.addEventListener('click', (e) => {
            if (!navDropdown.contains(e.target) && e.target !== hamburgerBtn) {
                navDropdown.classList.remove('open');
            }
        });
        document.querySelectorAll('.nav-dropdown button').forEach(btn => {
            btn.addEventListener('click', function() {
                const target = this.getAttribute('data-target');
                document.querySelectorAll('.halaman').forEach(h => h.classList.remove('active'));
                document.getElementById(target).classList.add('active');
                navDropdown.classList.remove('open');
            });
        });

        // ===== 2. LOGIKA AI CHAT (LOAD JSON) =====
        const messages = document.getElementById('ai-chat-messages');
        
        // Fetch data JSON (Karena knowledge.json bukan JS)
        fetch('knowledge.json')
            .then(res => res.json())
            .then(data => {
                window.allKnowledge = data; // Simpan di global
            })
            .catch(err => console.log("Gagal load JSON:", err));

        window.toggleChat = function() {
            const win = document.getElementById('ai-chat-window');
            win.style.display = win.style.display === 'flex' ? 'none' : 'flex';
        };

        window.sendChatGemini = function() {
            const input = document.getElementById('ai-chat-input').value.trim();
            if (!input) return;

            // Tampilkan pesan user
            messages.innerHTML += `<div style="text-align:right; background:#2E8B57; color:#fff; padding:10px; border-radius:10px; margin-bottom:10px;">${input}</div>`;
            document.getElementById('ai-chat-input').value = '';

            // Cari di knowledge.json
            let found = false;
            let reply = "Maaf, saya belum paham. Coba tanya soal Bu Okta atau Fauzan ya!";
            
            // Cek setiap topik
            if (window.allKnowledge) {
                for (let topic of window.allKnowledge) {
                    for (let kw of topic.keywords) {
                        if (input.toLowerCase().includes(kw.toLowerCase())) {
                            // Ambil balasan secara acak
                            const replies = topic.replies;
                            reply = replies[Math.floor(Math.random() * replies.length)];
                            found = true;
                            break;
                        }
                    }
                    if (found) break;
                }
            }

            messages.innerHTML += `<div style="text-align:left; background:#eee; padding:10px; border-radius:10px; margin-bottom:10px;">${reply}</div>`;
            messages.scrollTop = messages.scrollHeight;
        };
    </script>
</body>
</html>
